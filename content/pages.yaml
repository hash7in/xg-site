    desc: 在售的四条线：间歇式、塑料、连续式、废油蒸馏。
    desc_en: The four lines we build — batch, plastics, continuous and waste-oil distillation.
  - key: tech
    title: 工艺与产出
    title_en: Process & output
    desc: 出油率，以及一批料的电、水、人工与油、炭、气。
    desc_en: Oil yield, and what one batch costs and produces in power, water, crew, oil, char and gas.
  - key: reference
