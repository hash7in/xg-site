# 常青技术页。数字只来自 content/brochure.yaml，不在这里新编产能、收率或客户故事。
# 生成：build/site.py → /<slug>.html（中文）与 /en/<slug>.html（英文）
# 资源中心索引：/insights.html 与 /en/insights.html（按下面的 groups 分组展示）

# 资源中心页头文案
insights:
  kicker: 资源中心
  kicker_en: RESOURCES
  title: 技术资料与项目案例
  title_en: Technical Notes & Project References
  lead: >
    五条在售机型各自的结构、档位与交付条件，产出与投入的口径，以及名录里的项目。
    每页只写能被画册、设备配置表或现场照片对上的一句话，不编数字。
  lead_en: >
    Structure, capacity and delivery terms for the five lines we build; how output and input
    are stated; and the projects on record. Every page carries only what the brochure, the
    equipment schedule or a site photo can back up. No invented numbers.
  prod_head: 产品与设备线
  prod_head_en: Equipment & lines
  prod_desc: 五条在售机型，加上废塑料这一种原料单独的选型页。
  prod_desc_en: The five lines we build, plus a separate page for plastics as a feedstock.
  article_head: 技术文章与项目案例
  article_head_en: Notes & references
  article_desc: 出油率与一批料的产出怎么算，以及名录里的项目。
  article_desc_en: How yield and one batch of output are stated, and the projects on record.
  note_head: 这些页面怎么写的
  note_head_en: How these pages are written
  note: >
    产能、收率、交货期与名录只取自设备配置表与画册；没有实测数据的地方写明「按项目测算」，
    不填一个看起来合理的数字。名录里的客户名称在画册中已部分脱敏，现场与方案原件可到厂查阅。
  note_en: >
    Capacities, yields, lead times and the project list come from the equipment schedule and the
    brochure. Where we have no measured data the page says "calculated per project" instead of
    filling in a plausible number. Client names are partly anonymised in the brochure; site
    photos and proposal originals can be reviewed at the factory.

# 资源中心的分组（顺序即展示顺序）
groups:
