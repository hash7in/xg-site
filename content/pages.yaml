    title_en: References
    desc: 名录里的项目，配它对应的公开档位参数。
    desc_en: A project from the list, paired with the published figures for that size.

pages:
  - slug: tyre-pyrolysis
    group: line
    line: "01"
    img: r-batch.jpg
    title: 废轮胎间歇式裂解设备
    title_en: Waste Tyre Batch Pyrolysis Plant
    desc: 卧式旋转釜间歇式裂解：整胎切圈口进料，1–45 TPD，轮胎出油率 45%–50%，钢丝与炭黑可售。
    desc_en: "Batch pyrolysis in a horizontal rotary reactor: whole tyres with a bead cut, 1–45 TPD, 45–50% oil yield, saleable wire and carbon black."
    kicker: 间歇式裂解
    kicker_en: BATCH PYROLYSIS
    lead: 结构最简、出口量最大的一条线。一批一釜，整胎近乎直接进料。
    lead_en: The simplest line, and the most exported. One batch per charge; whole tyres feed almost as they are.
    sections:
      - h: 这条线做什么
        h_en: What the line does
        p:
          - 卧式旋转主炉，一批一釜：装料、密闭、升温裂解、冷却、出渣，单批约 20 小时。整胎只需切圈口，不切块、不磨粉。钢丝由抓机掏出，炭黑经螺旋进吨袋，两份都是可售产物。
          - 不凝气回收后作后续批次的釜底加热燃料。微负压运行，油气不外泄；超压自动泄放并紧急停火。
        p_en:
          - "Horizontal rotary reactor, one batch per charge: loading, sealing, heating, cooling and discharge, about 20 hours. Whole tyres need only a bead cut — no shredding, no grinding. Wire is lifted out by grab; carbon black goes into bulk bags by screw. Both are saleable."
          - Non-condensable gas is recovered and fired under the drum for later batches. Slight negative pressure keeps vapour inside; overpressure triggers relief and an emergency shut-off.
      - h: 档位
        h_en: Capacities
        p:
          - "1 / 2 / 5 / 10 / 15 / 20 / 45 TPD 可定做。常用档：YD-10（10 t/d，φ2600×6600×18，Q345R）、YD-15（15 t/d，φ2800×8000×18）、YD-20（20 t/d，φ3200×8000×20）。轮胎出油率按 45%–50% 计。撬装 YD-S1 为 1 t/d，到场接管即用。"
          - 制造约 35 个工作日，现场安装 20 天，试运行培训 3 天，整机质保 12 个月。
        p_en:
          - "1 / 2 / 5 / 10 / 15 / 20 / 45 TPD can be built. Common sizes: YD-10 (10 t/d, φ2600×6600×18, Q345R), YD-15 (15 t/d, φ2800×8000×18), YD-20 (20 t/d, φ3200×8000×20). Tyre oil yield is quoted at 45–50%. The YD-S1 skid is 1 t/d and runs on arrival."
          - About 35 working days to fabricate, 20 days to install, 3 days of trial run and training, 12-month warranty on the plant.
      - h: 已交付的轮胎项目（名录）
        h_en: Tyre projects on record
        p:
          - 名录中的轮胎间歇式项目包括：墨西哥 15 TPD、伊朗 20 TPD、埃及 1 与 5 TPD、阿富汗 10–20 TPD、巴基斯坦 2 / 5 TPD。摩洛哥 45 TPD 为轮胎加塑料。客户名称在画册中已脱敏，现场与方案原件可到厂查阅。
        p_en:
          - "Tyre batch plants on the project list include Mexico 15 TPD, Iran 20 TPD, Egypt 1 and 5 TPD, Afghanistan 10–20 TPD and Pakistan 2 / 5 TPD. Morocco 45 TPD is tyres plus plastics. Names in the brochure are partly anonymised; site photos and proposal originals can be reviewed at the factory."

  - slug: plastic-pyrolysis
    group: line
    img: r-batch.jpg
    title: 废塑料裂解设备
    title_en: Waste Plastic Pyrolysis Plant
    desc: 废塑料走间歇式裂解线，生活塑料、农膜、压缩料包与铝塑均可评估。斯里兰卡、秘鲁、中国项目在名录中。
    desc_en: "Waste plastics run on the batch pyrolysis line. Household plastic, film, bales and alu-plastic can be assessed. Sri Lanka, Peru and China projects are on record."
    kicker: 废塑料
    kicker_en: WASTE PLASTICS
    lead: 与轮胎同一套间歇式平台，原料换成塑料时要单独做选型，不套轮胎出油率。
    lead_en: Same batch platform as tyres. Plastic is sized on its own — tyre oil-yield figures are not reused.
    sections:
      - h: 能评估的塑料
        h_en: Plastics we assess
        p:
          - 画册列出的废塑料原料：生活塑料、农膜与包装膜、压缩料包、药用或光伏背板铝塑、造纸厂废塑料。不同料对应不同主机与预处理，请提供样品或化验单，选型与处理量测算不另收费。
        p_en:
          - "Plastics listed in the brochure: mixed household, film and packaging, baled feedstock, pharmaceutical or PV-backsheet alu-plastic, and paper-mill rejects. The reactor and pre-treatment change with the feed. Send a sample or a lab sheet; selection and throughput estimates are not charged extra."
      - h: 设备口径
        h_en: The plant
        p:
          - 间歇式裂解覆盖 1–45 TPD，一批一釜，单批约 20 小时。轮胎页上的 45%–50% 出油率只针对轮胎，塑料出油随料种变化，不在本页给统一数字。
          - 名录：斯里兰卡 Ecolux Bio Harvest，间歇式 15 / 50 TPD，废塑料；秘鲁 Peru Bioquimicos，间歇式 2 / 10 TPD，废塑料；中国福建 / 河南，间歇式 15 TPD ×4 套，塑料 / 轮胎。
        p_en:
          - "Batch pyrolysis covers 1–45 TPD, one charge per batch, about 20 hours. The 45–50% oil yield on the tyre page is for tyres only. Plastic yield depends on the resin and is not given as one number here."
          - "On record: Sri Lanka, Ecolux Bio Harvest, batch 15 / 50 TPD, waste plastics; Peru, Peru Bioquimicos, batch 2 / 10 TPD, waste plastics; China, Fujian / Henan, batch 15 TPD ×4 sets, plastics / tyres."

  - slug: skid-pyrolysis
    group: line
    line: "02"
    img: r-hotskid.jpg
    title: 撬装式裂解设备
    title_en: Skid-Mounted Pyrolysis Plant
    desc: 主炉、冷凝、气路与控制柜装在同一个底座上，1–4 TPD，到场接管即用。适合小规模试产与分布式收集点。
    desc_en: "Reactor, condenser, gas train and control panel on one base: 1–4 TPD, running on arrival. Built for pilot runs and distributed collection points."
    kicker: 撬装式
    kicker_en: SKID-MOUNTED
    lead: 把一条间歇式裂解线压进一个撬体。先跑通，再按同一套工艺扩产。
    lead_en: A batch pyrolysis line compressed onto one skid. Prove the flow, then scale on the same process.
    sections:
      - h: 这条线做什么
        h_en: What the skid does
        p:
          - 与间歇式同一套工艺：一批一釜，微负压运行，油气不外泄，不凝气回收后作后续批次的釜底加热燃料。差别在集成度——主炉、冷凝、气路与控制柜共用一个底座，现场不做法兰对接，接管即用。
          - 1 TPD 单套主炉为 Φ1200×2500×14，炉胆 Q345R。整机占地小，可装一个框架柜加一个高柜海运。
        p_en:
          - "The same batch process: one charge per batch, slight negative pressure, vapour kept inside, off-gas recovered and fired under the drum for later batches. What changes is integration — reactor, condenser, gas train and control panel share one base, so the site does no flange-up. Connect and run."
          - "The 1 TPD unit uses a Φ1200×2500×14 reactor with a Q345R shell. It ships as one frame container plus one high-cube."
      - h: 档位
        h_en: Capacities
        p:
          - 1 / 2 / 4 TPD 三档。3 TPD 撬装轮胎配置占地约 3.0 × 22 m，1 人操作，一个框架柜加一个高柜出运。按原料与批次策略可换釜体，吨位不是单一物理量，报价前要落到主炉规格上。
        p_en:
          - "1 / 2 and 4 TPD. The 3 TPD skid for tyres takes about 3.0 × 22 m, one operator, one frame container plus one high-cube. Shell size can be re-matched to feedstock and batch strategy: tonnage alone is not one physical figure, so a quote is pinned to the reactor spec."
      - h: 常见用法
        h_en: How it is used
        p:
          - 试产与分布式收集点：先在原料集散地上一套 1–4 TPD 跑通油与炭的销路，再复制或放大。名录中的组合用法是 2×1 TPD 撬装加 1 TPD 蒸馏，原料为轮胎油（越南 Zana / David）。
        p_en:
          - "Pilot runs and distributed collection points: run 1–4 TPD where the feedstock is collected, prove where the oil and char go, then replicate or scale. A combination on record is 2×1 TPD skids plus 1 TPD distillation on tyre oil (Vietnam, Zana / David)."

  - slug: continuous-pyrolysis
    group: line
    line: "03"
    img: r-continuous.jpg
    title: 连续式裂解设备
    title_en: Continuous Pyrolysis Plant
    desc: 氮气置换、连续进出料、高温密封出渣。常用 30 / 40 / 50 t/d，YD-C30 与 YD-C45 两档参数见页内。
    desc_en: "Nitrogen purged, continuous feed and discharge, sealed slag-out at temperature. Standard 30 / 40 / 50 t/d. YD-C30 and YD-C45 figures are on this page."
    kicker: 连续式裂解
    kicker_en: CONTINUOUS PYROLYSIS
    lead: 不停机、不降温，把一批一釜变成流水线。
    lead_en: No shutdown and no cool-down — a batch cycle becomes a production line.
    sections:
      - h: 工艺
        h_en: Process
        p:
          - 卧式旋转主机配螺旋连续进料与高温密封出渣。氮气置换后升温至约 400 °C，原料、油气与炭渣连续流动，省掉升降温热损。不凝气经两级水封和阻火器进热风炉，供后续加热。
          - 废气经二级喷淋脱硫除尘后排放，脱硝可按项目地标准选配。排放按当地限值承诺达标，不做「天生达标」。
        p_en:
          - "A rotary reactor with screw feeding and high-temperature sealed discharge. After a nitrogen purge the shell heats to about 400 °C; feed, oil vapour and residue move continuously, so heat-up and cool-down losses drop out. Off-gas passes two water seals and a flame arrestor into the hot-air furnace."
          - "Flue gas goes through two-stage desulphurization and dedusting. DeNOx is optional to local limits. We commit to meeting the local standard with that equipment, not to being compliant by default."
      - h: 两档主机
        h_en: Two standard reactors
        p:
          - YD-C30：30 t/d，φ1800×24000×16，Q345R，装机 100 kW，占地 350 ㎡，3 人，设计寿命 5–8 年。YD-C45：45 t/d，φ1800×36000×18，12CrMoV，装机 120 kW，占地 500 ㎡，3 人，设计寿命 8–10 年。常用还有 40 / 50 t/d，可定做。
          - 合同后约 70 个工作日交货。质保 3 年（易损件除外），终身免费检测维护。名录中的连续式项目：波兰政府项目，40 TPD，粪浆 / 污泥。
        p_en:
          - "YD-C30: 30 t/d, φ1800×24000×16, Q345R, 100 kW, 350 m², crew of 3, design life 5–8 years. YD-C45: 45 t/d, φ1800×36000×18, 12CrMoV, 120 kW, 500 m², crew of 3, design life 8–10 years. 40 and 50 t/d are also standard, and custom sizes are available."
          - "Delivery is about 70 working days after contract. Warranty is 3 years excluding wear parts, with lifetime inspection support. Continuous project on record: Poland, government project, 40 TPD, slurry / sewage sludge."

  - slug: waste-oil-distillation
    group: line
    line: "04"
    img: r-distill.jpg
    title: 废油蒸馏精制设备
    title_en: Waste Oil Distillation Plant
    desc: 常压或减压精馏，处理废机油、轮胎油与塑料油。柴油组分收率 75%–90%，8–30 TPD，无工艺污水外排。
    desc_en: "Atmospheric or vacuum distillation for waste lube, tyre oil and plastic oil. 75–90% diesel-range yield, 8–30 TPD, no process wastewater."
    kicker: 废油蒸馏
    kicker_en: DISTILLATION
    lead: 把裂解油和废机油做成柴油类工业燃料。
    lead_en: Turns pyrolysis oil and waste lube into diesel-range industrial fuel.
    sections:
      - h: 工艺
        h_en: Process
        p:
          - 常压或减压精馏，预热、反应釜、提气塔、盘管与列管冷凝、分流油罐和脱硫除尘在一条线上。减压时气化温度比常压提前约 50 °C，终馏温度低约 80 °C，燃料成本约省 20%。无工艺污水，冷却水循环；废气经喷枪进加热炉烧掉。
          - 可处理的废油：废机油、轮胎油、塑料油、液压油 / 导热油、变压器油、渣油 / 舱底油。
        p_en:
          - "Atmospheric or vacuum distillation: preheater, reactor, stripping column, coil and shell-and-tube condensers, fraction tanks and a scrubber on one line. Under vacuum, vaporization starts about 50 °C earlier and the end point is about 80 °C lower, at roughly 20% less fuel. No process wastewater; cooling water is recirculated; off-gas is burnt in the furnace."
          - "Oils listed: waste lube, tyre oil, plastic oil, hydraulic and heat-transfer oil, transformer oil, sludge and bilge oil."
      - h: 档位与收率
        h_en: Sizes and yield
        p:
          - 柴油组分收率 75%–90%。另一组馏分口径：柴油组分 60%–65%，轻油 5%–10%，重油 15%–20%。ZL-1600 为 8–10 t/d（φ1600×6600，Q345R）；ZL-2200 为 15–20 t/d（φ1800×7000）；ZL-2400 为 20–30 t/d（φ1800×7700，Q345R / 310S）。装机 16.7–24.2 kW，占地 200–400 ㎡，2–3 人。20 t/d 以下实际占地可小于 200 ㎡。催化剂 1 吨可处理 800–1000 吨废机油。
          - 制造 35–40 天，质保 12 个月。名录：越南 Zana / David，撬装 2×1 TPD 加蒸馏 1 TPD，原料为轮胎油。马来西亚有蒸馏现场照片。
        p_en:
          - "Diesel-range yield is 75–90%. A second cut of the same product is diesel fraction 60–65%, light oil 5–10% and heavy oil 15–20%. ZL-1600 is 8–10 t/d (φ1600×6600, Q345R); ZL-2200 is 15–20 t/d (φ1800×7000); ZL-2400 is 20–30 t/d (φ1800×7700, Q345R / 310S). Installed power 16.7–24.2 kW, footprint 200–400 m², crew of 2–3. Below 20 t/d the real footprint can stay under 200 m². One tonne of catalyst treats 800–1000 t of waste oil."
          - "Fabrication is 35–40 days, with a 12-month warranty. On record: Vietnam, Zana / David, skid 2×1 TPD plus 1 TPD distillation, tyre oil. A distillation site photo is from Malaysia."

  - slug: biomass-carbonization
    group: line
    line: "05"
    img: r-carbon.jpg
    title: 连续式生物质炭化设备
    title_en: Continuous Biomass Carbonization Plant
    desc: 稻壳、秸秆、锯末、椰壳、棕榈壳、木片连续炭化，1–3 t/h。气炭联产：自产可燃气回供，1/3 热能自用、2/3 供烘干。
    desc_en: "Continuous carbonization for rice husk, straw, sawdust, coconut shell, palm kernel shell and wood chips at 1–3 t/h. Gas-and-char co-generation: self-fuelled, one third of the heat runs the line, two thirds dry the feed."
    kicker: 生物质炭化
    kicker_en: CARBONIZATION
    lead: 一条不靠外购燃料的连续线：进料烘干 → 约 350 ℃ 炭化 → 冷却出炭 → 烟气净化。
    lead_en: A continuous line that buys almost no fuel — dry, carbonize at about 350 °C, cool the char out, clean the flue gas.
    sections:
      - h: 四段工艺
        h_en: Four stages
        p:
          - 原料破碎到 ≤20 mm（建议 2–3 cm），烘干到含水 ≤15%。热风炉把炭化炉筒体加热到 300–350 ℃ 起料；木片在 350 ℃ 左右开始裂解产烟，烟气进约 900 ℃ 的高温燃烧炉燃烧转热。
          - 出炭走 2–3 段冷却绞龙降到常温，不停机直接包装。烟气经列管冷却器降温后进喷淋塔；烘干烟气先沙克龙除尘再进喷淋塔。
        p_en:
          - "Feed is crushed to ≤20 mm (2–3 cm preferred) and dried to ≤15% moisture. A hot-air furnace heats the retort shell to 300–350 °C; wood chips start to pyrolyse and smoke at about 350 °C, and that gas burns in a combustion chamber at roughly 900 °C, returning heat to the shell."
          - "Char leaves through two or three cooling screws down to ambient and is bagged without stopping the line. Flue gas is cooled in a shell-and-tube exchanger before the spray tower; drying gas is cyclone-separated first."
      - h: 档位
        h_en: Capacities
        p:
          - DY-T-1 / DY-T-2 / DY-T-3 对应 1 / 2 / 3 吨每小时，炉体 Φ1300 / 1600 / 1800 × 14000。占地约 38 × 10 m（含 8 m 高度），1–2 人/班次。
          - 日产炭 20 吨的木片线按项目定做：炉体 Φ2000×20000，304 材质 16 mm，保温加热区 12 m，配 Φ2400×18000 烘干机，整场约 9000 ㎡，总装机 156.5 kW。
        p_en:
          - "DY-T-1 / DY-T-2 / DY-T-3 cover 1 / 2 / 3 t per hour with Φ1300 / 1600 / 1800 × 14000 retorts. Footprint about 38 × 10 m including 8 m headroom, one to two operators per shift."
          - "The 20 t/day wood-chip line is built per project: Φ2000×20000 retort in 304 at 16 mm, 12 m heated zone, Φ2400×18000 dryer, a site of about 9,000 m² and 156.5 kW installed."
      - h: 产出与热能
        h_en: Output and heat balance
        p:
          - 产出固体炭、木醋液、焦油与可燃气。稳定运行后靠自产可燃气，一般不外购燃料，不足时补外部燃料；正常运行所需热能约 1/3 自用，其余 2/3 可供烘干机。连续进出料可跑 7–10 天再停。
          - 可处理的原料：稻壳、秸秆、锯末、木屑、树皮、椰壳、玉米芯、竹子、棕榈壳、木片。
        p_en:
          - "Outputs are solid char, wood vinegar, tar and combustible gas. Once stable the line runs on its own gas and normally buys no fuel, topping up only when short. About one third of the heat runs the line; the other two thirds can dry the feed. Continuous operation runs 7–10 days between stops."
          - "Feedstocks: rice husk, straw, sawdust, wood shavings, bark, coconut shell, corn cob, bamboo, palm kernel shell and wood chips."

  - slug: pyrolysis-oil-yield
    group: tech
    img: oil-pour.jpg
    title: 裂解出油率与一批料的产出
    title_en: Pyrolysis Oil Yield and Batch Output
    desc: 轮胎间歇式出油率 45%–50%。10 TPD 线每批 10 吨轮胎的用电、补水、人工与油、炭、气产出，按画册口径列出。
    desc_en: "Tyre batch oil yield is 45–50%. Electricity, water, crew and oil, char and gas from a 10 t tyre batch on a 10 TPD line, as stated in the brochure."
    kicker: 产出
    kicker_en: OUTPUT
    lead: 下面的数字只描述 10 TPD 间歇式、每批 10 吨轮胎。塑料、油泥不套用这组数。
    lead_en: These figures describe a 10 TPD batch line and a 10 t tyre charge. They are not reused for plastics or sludge.
    sections:
      - h: 出油率
        h_en: Oil yield
        p:
          - 间歇式规格表把轮胎出油率标为 45%–50%。蒸馏线的柴油组分收率是另一件事，为 75%–90%，见废油蒸馏页。
        p_en:
          - "The batch specification table marks tyre oil yield at 45–50%. Diesel-range yield on the distillation line is a different figure, 75–90%, on the waste-oil page."
      - h: 一批 10 吨轮胎
        h_en: One 10-tonne tyre batch
        p:
          - 投入：整线日用电 360 kWh，冷却水补水 2 m³，操作 3 人/班，开车天然气 400 m³（稳定后改由自产气供后续批次）。
          - 产出：裂解油约 4.5 t，炭渣 / 回收炭黑约 3.8 t，不凝气约 0.9 t（回烧），钢丝视轮胎类型另计。四项合计不必等于 10 t。
          - 按 300 个运行日折算：入厂原料约 3,000 t/年，裂解油约 1,350 t/年，炭渣约 1,140 t/年。检修与雨季另计。设备投资与回本按项目测算，不在本页列价。
        p_en:
          - "Inputs: 360 kWh electricity for the line per day, 2 m³ cooling-water make-up, 3 operators per shift, 400 m³ of natural gas to start (off-gas heats later batches once the line is stable)."
          - "Outputs: about 4.5 t pyrolysis oil, about 3.8 t char / recovered carbon black, about 0.9 t non-condensable gas fired back to the burner. Steel wire depends on the tyre and is extra. The four outputs need not sum to 10 t."
          - "Over 300 operating days: about 3,000 t/yr of feedstock, about 1,350 t/yr of oil, about 1,140 t/yr of char. Maintenance and a rainy season sit outside that. Equipment price and payback are calculated per project and are not listed here."

  - slug: reference-mexico-tyres
    group: reference
    img: r-batch.jpg
    title: 案例：墨西哥 15 TPD 废轮胎间歇式
    title_en: "Reference: Mexico 15 TPD Waste Tyre Batch Plant"
    desc: 项目名录中的一条：墨西哥，间歇式 15 TPD，原料废轮胎。页内只写名录与 YD-15 的公开参数，不补充未公开的运行数据。
    desc_en: "One line from the project list: Mexico, batch 15 TPD, waste tyres. This page states that row and the published YD-15 figures only."
    kicker: 案例
    kicker_en: REFERENCE
    lead: 名录里的一条轮胎项目。客户名在画册中写作 Cxx，此处不展开。
    lead_en: One tyre project from the list. The brochure records the client as Cxx; nothing further is added here.
    sections:
      - h: 名录原文
        h_en: What is on record
        p:
          - 国家：墨西哥。机型：间歇式 15 TPD。原料：废轮胎。客户名称已脱敏。现场照片与方案原件可到厂查阅，本页不转述未写入画册的产量或合同条款。
        p_en:
          - "Country: Mexico. Line: batch 15 TPD. Feedstock: waste tyres. The client name is anonymised. Site photos and the original proposal can be reviewed at the factory. This page does not add output or contract terms that are not in the brochure."
      - h: 15 TPD 对应的公开档位
        h_en: The published 15 TPD size
        p:
          - YD-15：15 t/d，主炉 φ2800×8000×18，材质 Q345R，单批约 20 小时，轮胎出油率 45%–50%。间歇式制造约 35 个工作日，安装 20 天，试运行培训 3 天，整机质保 12 个月。
        p_en:
          - "YD-15: 15 t/d, reactor φ2800×8000×18, Q345R, about 20 hours per batch, tyre oil yield 45–50%. Batch plants take about 35 working days to fabricate, 20 days to install and 3 days to commission and train, with a 12-month warranty."
