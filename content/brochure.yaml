lines:
  kicker: 产品矩阵
  kicker_en: PRODUCT LINES
  lead: 五条产品线，一套工艺体系：热解出油 → 蒸馏提纯 → 炭渣深加工，可单机、可整线、可组合。
  lead_en: Five lines on one process platform — pyrolysis to oil, distillation to fuel, carbon residue to value. Single units, full lines, or combinations.
  items:
    - {num: "01", cn: 间歇式裂解, en: Batch Pyrolysis, cap: 1 – 45 TPD, img: r-batch.jpg,
cn2: 卧式旋转釜，一批一釜；整胎近乎直接进料（只需切圈口），抓机出钢丝、炭黑装吨袋，两份都能卖。,
cn2_en: "Horizontal rotary reactor, one batch per charge; whole tyres feed almost as they are — bead cut only. Wire comes out by grab, carbon black in bulk bags; both are saleable."}
    - {num: "02", cn: 撬装式裂解, en: Skid-Mounted, cap: 1 – 4 TPD, img: r-hotskid.jpg,
cn2: 一体撬装，到场接管即用；适合小规模试产与分布式收集点。,
cn2_en: "Reactor, condenser and controls on one skid — running on arrival, built for pilot runs and distributed collection points."}
    - {num: "03", cn: 连续式裂解, en: Continuous Pyrolysis, cap: 30 – 50 TPD, img: r-continuous.jpg,
cn2: 氮气置换、连续进出料，高温密封出渣不停机，一台炉两名工人。,
cn2_en: "Nitrogen purged, continuous in and out; sealed discharge at temperature without stopping. One reactor, two operators."}
    - {num: "04", cn: 废油蒸馏, en: Distillation, cap: 8 – 30 TPD, img: r-distill.jpg,
cn2: 常压 / 减压精馏，柴油组分收率 75%–90%，无工艺污水外排。,
cn2_en: "Atmospheric or vacuum distillation, 75–90% diesel-range yield, no process wastewater."}
    - {num: "05", cn: 生物质炭化, en: Carbonization, cap: 1 – 3 t/h, img: r-carbon.jpg,
cn2: 连续式气炭联产，自产可燃气回供，1/3 热能自用、2/3 供烘干。,
cn2_en: "Continuous gas-and-char co-generation; self-fuelled, one third of the heat runs the line, two thirds dry the feed."}

  combos_head: 常见组合
  combos_head_en: TYPICAL COMBINATIONS
  combos:
    - {t: 裂解 + 蒸馏, t_en: Pyrolysis + Distillation, d: 裂解油再精制成柴油类工业燃料，一座厂把油卖上价。, d_en: Re-refine pyrolysis oil into diesel-range fuel — sell oil at fuel price from one site.}
    - {t: 裂解 + 炭化, t_en: Pyrolysis + Carbonization, d: 炭渣深加工为再生炭黑、炭基材料，把「废料」做成产品。, d_en: Upgrade carbon residue into recovered carbon black and carbon materials.}
    - {t: 蒸馏 + 撬装裂解, t_en: Distillation + Skid, d: 小规模试产：2×1 TPD 撬装配 1 TPD 蒸馏，先跑通再扩产。, d_en: "Pilot first — 2×1 TPD skids plus 1 TPD distillation, prove the flow, then scale."}

batch:
  num: "07"
  kicker: 间歇式 / 撬装式裂解
  kicker_en: BATCH & SKID PYROLYSIS
  lead: 结构最简、上手最快的一条线，也是出口量最大的一条。
  lead_en: The simplest line to run — and our most exported one.
  image: drums-row.jpg
  intro: 卧式旋转主炉，一批一釜：装料、密闭、升温裂解、冷却、出渣，单批约 20 小时。整胎近乎直接进料，只需切圈口，无需切块或磨粉；钢丝由抓机掏出，炭黑经螺旋进吨袋。撬装型把主炉、冷凝、气路、控制柜装进一个底座，1–4 TPD 到场接管即用。
  intro_en: "Horizontal rotary reactor, one batch per charge — loading, sealing, heating, cooling, discharge, about 20 hours per batch. Whole tyres feed almost as they are: bead cut only, no shredding or grinding. Wire is lifted out by grab, carbon black goes into bulk bags by screw. The skid version packs reactor, condenser, gas train and control panel onto one base for 1–4 TPD, ready on arrival."
  specs_head: [型号档位, 日处理量, 主炉规格, 材质, 单批周期, 出油率]
  specs_head_en: [Model, Capacity, Reactor, Shell material, Batch cycle, Oil yield]
  specs:
    - ["YD-10", "10 t/d", "φ2600 × 6600 × 18", "Q345R", "约 20 h", "45%–50%"]
    - ["YD-15", "15 t/d", "φ2800 × 8000 × 18", "Q345R", "约 20 h", "45%–50%"]
    - ["YD-20", "20 t/d", "φ3200 × 8000 × 20", "Q345R", "约 20 h", "45%–50%"]
    - ["YD-S1", "撬装 1 t/d", "φ1200 × 2500 × 14", "Q345R", "一体撬装", "按原料定"]
  specs_en:
    - ["YD-10", "10 t/d", "φ2600 × 6600 × 18", "Q345R", "≈20 h", "45%–50%"]
    - ["YD-15", "15 t/d", "φ2800 × 8000 × 18", "Q345R", "≈20 h", "45%–50%"]
    - ["YD-20", "20 t/d", "φ3200 × 8000 × 20", "Q345R", "≈20 h", "45%–50%"]
    - ["YD-S1", "skid 1 t/d", "φ1200 × 2500 × 14", "Q345R", "single skid", "feedstock based"]
  specs_note: 1 / 2 / 5 / 10 / 15 / 20 / 45 TPD 均可定做；同吨位可按原料与批次策略换釜体。
  specs_note_en: 1 / 2 / 5 / 10 / 15 / 20 / 45 TPD available; shell size may be re-matched to feedstock and batch strategy.
  highlights:
    - {cn: 整胎进料, cn2: 全尺寸整胎，唯一预处理是切圈口；无需切块、无需磨粉，近乎整胎直接进料, en: Whole-tyre feed, cn2_en: Any tyre size; the only pre-treatment is a bead cut — no shredding, no grinding, the tyre goes in almost whole}
    - {cn: 两份可卖产物, cn2: 钢丝抓机掏出，炭黑螺旋进吨袋；钢丝与炭黑都是有价产物，不是废料, en: Two saleable solids, cn2_en: Wire out by grab, carbon black out by screw conveyor — both sell on, neither is waste}
    - {cn: 不凝气回用, cn2: 不凝气回收后作后续批次釜底加热燃料，大幅降低本体燃料需求, en: Off-gas reused, cn2_en: Non-condensable gas is recovered and fired under the drum to heat later batches, cutting the line's own fuel demand sharply}
    - {cn: 微负压运行, cn2: 油气不外泄；超压自动泄放、紧急停火, en: Slight negative pressure, cn2_en: Slight negative pressure keeps vapour inside; relief and emergency shut-off on overpressure}
  photos:
    - {img: r-batch.jpg, cn: 间歇式产线 3D 方案图, en: Batch line — 3D layout}
    - {img: ship-truck.jpg, cn: 整机装车发运, en: Reactor loaded for shipment}
  foot: 制造约 35 个工作日 · 现场安装 20 天 · 试运行培训 3 天 · 整机质保 12 个月
  foot_en: ~35 working days fabrication · 20 days installation · 3 days trial run & training · 12-month warranty

continuous:
  num: "08"
  kicker: 连续式裂解
  kicker_en: CONTINUOUS PYROLYSIS
  lead: 不停机、不降温，把「一批一釜」变成一条流水线。
  lead_en: No shutdown, no cooling — batch becomes a production line.
  image: continuous-line.jpg
  intro: 卧式旋转主机配螺旋连续进料与高温密封出渣：氮气置换后升温至 400 °C 左右，原料连续进、油气连续出、炭渣连续排，省掉升降温热损。废气经二级喷淋脱硫除尘后排放，配脱硝选配可达项目地标准。
  intro_en: A rotary reactor with screw feeding and high-temperature sealed discharge. After nitrogen purging the shell is heated to about 400 °C; feed, oil vapour and residue flow continuously, removing heat-up and cool-down losses. Flue gas passes two-stage desulphurization and dedusting, with DeNOx available to meet local limits.
  specs_head: [机型, 日处理量, 主炉规格, 材质, 装机功率, 占地, 人工, 使用寿命]
  specs_head_en: [Model, Capacity, Reactor, Shell material, Power, Footprint, Crew, Service life]
  specs:
    - ["YD-C30", "30 t/d", "φ1800 × 24000 × 16", "Q345R", "100 kW", "350 ㎡", "3 人", "5–8 年"]
    - ["YD-C45", "45 t/d", "φ1800 × 36000 × 18", "12CrMoV", "120 kW", "500 ㎡", "3 人", "8–10 年"]
  specs_en:
    - ["YD-C30", "30 t/d", "φ1800 × 24000 × 16", "Q345R", "100 kW", "350 m²", "3", "5–8 yr"]
    - ["YD-C45", "45 t/d", "φ1800 × 36000 × 18", "12CrMoV", "120 kW", "500 m²", "3", "8–10 yr"]
  specs_note: 常用 30 / 40 / 50 t/d，可定做；45 t/d 项目按 8 套主机配置，年处理胶粉约 10 万吨。
  specs_note_en: Standard 30 / 40 / 50 t/d, custom available; the 45 t/d project runs 8 reactor sets, about 100,000 t of crumb per year.
  highlights:
    - {cn: 连续进料连续出渣, cn2: 高温密封出渣，无需降温开门，单台炉两名工人, en: "Continuous in, continuous out", cn2_en: "Sealed discharge at temperature, no cooling or door opening; two operators per reactor"}
    - {cn: 自产气回用, cn2: 不凝气经两级水封 + 阻火器进热风炉，供后续批次加热，大幅降低燃料消耗, en: Off-gas reuse, cn2_en: Off-gas passes two water seals and a flame arrestor into the hot-air furnace, heating later batches and cutting fuel consumption sharply}
    - {cn: 二级脱硫除尘, cn2: 喷淋塔 + 引风机 + 烟囱，白烟无黑烟；脱硝可按标准选配, en: Two-stage scrubbing, cn2_en: "Spray tower, induced-draft fan and stack — white plume, no black smoke; DeNOx optional to local limits"}
    - {cn: 大型主机自制, cn2: 12CrMoV 锅炉合金钢板筒体，齿圈传动 0.4 r/min, en: Large shells in-house, cn2_en: "12CrMoV boiler-alloy shell, girth-gear drive at 0.4 r/min"}
  photos:
    - {img: r-continuous.jpg, cn: 连续式产线 3D 方案图, en: Continuous line — 3D layout}
    - {img: ship-reactor.jpg, cn: 主炉装车发运, en: Reactor on the trailer}
  foot: 合同签订后约 70 个工作日交货 · 质保 3 年（易损件除外） · 终身免费检测维护
  foot_en: ~70 working days delivery · 3-year warranty (wear parts excluded) · lifetime inspection support

distillation:
  num: "09"
  kicker: 废油蒸馏精制
  kicker_en: DISTILLATION & REFINING
  lead: 把裂解油、废机油做成能卖上价的柴油类工业燃料。
  lead_en: Turning pyrolysis oil and waste lube into sellable diesel-range fuel.
  image: dist-indoor.jpg
  intro: 常压或减压精馏：预热、反应釜、提气塔、盘管与列管冷凝、分流油罐、脱硫除尘器一体成线。减压下各组分沸点降低，气化温度比常压提前约 50 °C、终馏温度低约 80 °C，抑制塔内分解聚合，油色更清亮、硫更低，燃料成本约省 20%。
  intro_en: Atmospheric or vacuum distillation — preheater, reactor, stripping column, coil and shell-and-tube condensers, fraction tanks and scrubber on one line. Under vacuum boiling points drop — vaporization starts about 50 °C earlier and end point is about 80 °C lower, suppressing cracking and polymerization, giving brighter, lower-sulphur product at roughly 20% less fuel.
  specs_head: [系列, 日处理量, 主炉规格, 材质, 柴油组分收率, 装机功率, 占地, 人工]
  specs_head_en: [Series, Capacity, Reactor, Material, Diesel yield, Power, Footprint, Crew]
  specs:
    - ["ZL-1600", "8 – 10 t/d", "φ1600 × 6600", "Q345R", "75%–90%", "16.7–24.2 kW", "200–400 ㎡", "2–3 人"]
    - ["ZL-2200", "15 – 20 t/d", "φ1800 × 7000", "Q345R", "75%–90%", "16.7–24.2 kW", "200–400 ㎡", "2–3 人"]
    - ["ZL-2400", "20 – 30 t/d", "φ1800 × 7700", "Q345R / 310S", "75%–90%", "16.7–24.2 kW", "200–400 ㎡", "2–3 人"]
  specs_en:
    - ["ZL-1600", "8 – 10 t/d", "φ1600 × 6600", "Q345R", "75%–90%", "16.7–24.2 kW", "200–400 m²", "2–3"]
    - ["ZL-2200", "15 – 20 t/d", "φ1800 × 7000", "Q345R", "75%–90%", "16.7–24.2 kW", "200–400 m²", "2–3"]
    - ["ZL-2400", "20 – 30 t/d", "φ1800 × 7700", "Q345R / 310S", "75%–90%", "16.7–24.2 kW", "200–400 m²", "2–3"]
  specs_note: 20 t/d 以下实际占地 <200 ㎡；催化剂 1 吨可处理 800–1000 吨废机油。
  specs_note_en: Below 20 t/d actual footprint stays under 200 m²; one tonne of catalyst treats 800–1000 t of waste oil.
  highlights:
    - {cn: 减压精馏, cn2: 沸点降低、停留时间缩短，油色清亮、硫含量低, en: Vacuum distillation, cn2_en: "Lower boiling points and shorter residence time — brighter oil, lower sulphur"}
    - {cn: 无水排放, cn2: 无工艺污水，冷却水循环使用；废气经喷枪进加热炉烧掉, en: No process wastewater, cn2_en: No process wastewater; cooling water recirculated; off-gas burnt in the furnace}
    - {cn: 立体安装, cn2: 进料与出渣靠自身真空压差，不另配动力, en: Gravity/vacuum feed, cn2_en: Feed and discharge by vacuum differential — no extra pumps}
    - {cn: 成品可直接销, cn2: 柴油组分 60%–65% + 轻油 5%–10% + 重油 15%–20%, en: Directly sellable fractions, cn2_en: Diesel fraction 60–65% + light oil 5–10% + heavy oil 15–20%}
  photos:
    - {img: dist-site.jpg, cn: 海外蒸馏现场（马来西亚）, en: Distillation site abroad (Malaysia)}
    - {img: oil-pour.jpg, cn: 出油取样, en: Product sampling}
  foot: 制造 35–40 天 · 常压 / 减压可选 · 质保 12 个月
  foot_en: 35–40 days fabrication · atmospheric or vacuum · 12-month warranty

carbonization:
  num: "10"
  kicker: 生物质炭化
  kicker_en: BIOMASS CARBONIZATION
  lead: 气炭联产，自产可燃气回供，连续跑 7–10 天不停炉。
  lead_en: Gas-and-char co-generation, self-fuelled, running 7–10 days without a stop.
  image: r-carbon.jpg
  intro: 稻壳、秸秆、锯末、木片、椰壳、棕榈壳等破碎至 ≤20 mm、含水 ≤15% 后连续进料。热风炉间接加热筒体到 300–350 °C，物料裂解产烟；烟气进约 900 °C 高温燃烧炉转热，冷却绞龙把炭降到常温直接包装。正常运行所需热能约 1/3 自用，2/3 可供烘干。
  intro_en: Rice husk, straw, sawdust, wood chips, coconut or palm shell are crushed to ≤20 mm and dried to ≤15% moisture, then fed continuously. A hot-air furnace heats the shell indirectly to 300–350 °C; the volatiles burn in a ~900 °C chamber and the heat is recovered, while cooling screws bring char to ambient for bagging. About one third of the heat runs the line; two thirds can dry feedstock.
  specs_head: [机型, 原料处理量, 主炉规格, 加热方式, 占地, 人工, 适用原料]
  specs_head_en: [Model, Feed rate, Reactor, Heating, Footprint, Crew, Feedstock]
  specs:
    - ["DY-T-1", "1 t/h", "Φ1300 × 14000", "间接加热（热风炉）", "38 × 10 × 8 m", "1–2 人/班", "稻壳 / 秸秆 / 锯末"]
    - ["DY-T-2", "2 t/h", "Φ1600 × 14000", "间接加热（热风炉）", "38 × 10 × 8 m", "1–2 人/班", "木片 / 椰壳 / 棕榈壳"]
    - ["DY-T-3", "3 t/h", "Φ1800 × 14000", "间接加热（热风炉）", "38 × 10 × 8 m", "1–2 人/班", "木片 / 竹 / 玉米芯"]
  specs_en:
    - ["DY-T-1", "1 t/h", "Φ1300 × 14000", "Indirect (hot-air furnace)", "38 × 10 × 8 m", "1–2 per shift", "Rice husk / straw / sawdust"]
    - ["DY-T-2", "2 t/h", "Φ1600 × 14000", "Indirect (hot-air furnace)", "38 × 10 × 8 m", "1–2 per shift", "Wood chips / coconut / palm shell"]
    - ["DY-T-3", "3 t/h", "Φ1800 × 14000", "Indirect (hot-air furnace)", "38 × 10 × 8 m", "1–2 per shift", "Wood chips / bamboo / corn cob"]
  specs_note: 木片整线按日产炭 20 吨定制：Φ2000 × 20000 主炉（304 不锈钢 16 mm）+ Φ2400 × 18000 烘干机，总功率 156.5 kW，整场约 9000 ㎡。
  specs_note_en: A 20 t/day wood-chip line is custom built — Φ2000 × 20000 reactor (304 SS, 16 mm) plus Φ2400 × 18000 dryer, 156.5 kW total, about 9000 m² site.
  highlights:
    - {cn: 连续 24 小时, cn2: 连续进出料，可连续生产 7–10 天, en: 24-hour operation, cn2_en: "Continuous in and out, 7–10 days without a stop"}
    - {cn: 燃料自给, cn2: 稳定后靠自产可燃气，一般无需外购燃料, en: Self-fuelled, cn2_en: "Once stable, self-produced gas covers the heat demand — no bought fuel"}
    - {cn: 间接加热, cn2: 单一热风炉热辐射，炉体损伤小、单点控温, en: Indirect heating, cn2_en: "Single hot-air furnace, radiant heat — less shell damage, one-point temperature control"}
    - {cn: 余热烘干, cn2: 炭化烟气余热去烘干，1/3 自用、2/3 供热, en: Waste-heat drying, cn2_en: "Flue-gas waste heat dries feedstock — one third self-use, two thirds to the dryer"}
  photos:
    - {img: charcoal-bags.jpg, cn: 成品炭包装出厂, en: Bagged char leaving the plant}
    - {img: samples-jars.jpg, cn: 炭 / 颗粒样品, en: Char and pellet samples}
  foot: 按原料与产能定制 · 现场安装调试 · 质保 12 个月
  foot_en: Custom-built to feedstock and capacity · on-site commissioning · 12-month warranty

