    - {cn: 人工, en: Operators, cn2: 间歇线约 3 人/班，连续线 1–2 人/班，可从本地招聘后培训, en2: "About 3 per shift on batch lines, 1–2 on continuous; trained from local hires"}
    - {cn: 手续, en: Permits, cn2: 环评、用地、危废处理与产品外销资质；XG 提供工艺资料与申报协助, en2: "EIA, land use, waste handling and offtake licences; XG supplies process data and filing support"}
  delivery_head: 我们的交付
  delivery_head_en: WHAT XG DELIVERS
  delivery:
    - {cn: 设计, en: Design, cn2: 工艺计算、总图与三维布置、设备图纸与选型, en2: "Process calculation, general layout, 3D arrangement, equipment drawings and selection"}
    - {cn: 制造, en: Fabrication, cn2: 下料、卷板、焊接、机加工、装配、试机全部在自有厂区, en2: "Cutting, rolling, welding, machining, assembly and test run on our own floor"}
    - {cn: 安装, en: Installation, cn2: 现场安装、管道与电缆敷设、保温防腐, en2: "On-site erection, piping and cabling, insulation and coating"}
    - {cn: 调试, en: Commissioning, cn2: 冷态试车到首次出油，温度曲线与操作规程一并移交, en2: "Cold commissioning through to first oil; temperature curve and SOP handed over"}
    - {cn: 培训, en: Training, cn2: 操作、巡检、安全联锁与常见故障处理, en2: "Operation, inspection rounds, safety interlocks and fault handling"}
    - {cn: 售后, en: Service, cn2: 备件供应、油品送检与买家对接、远程诊断, en2: "Spares, oil testing, offtake introductions and remote diagnostics"}
  inputs_head: 一批料的投入
  inputs_head_en: WHAT A BATCH TAKES
  inputs_unit: 以 10 TPD 间歇式线每批 10 t 轮胎为例
  inputs_unit_en: Per 10 t tyre batch on a 10 TPD batch line
  inputs:
    - {v: "360", u: kWh, k: 整线日用电, k_en: "Electricity, line per day"}
    - {v: "2", u: m³, k: 冷却水补水, k_en: Cooling-water make-up}
    - {v: "3", u: 人/班, u_en: per shift, k: 操作人工, k_en: Operators}
    - {v: "400", u: m³, k: 开车天然气，稳定后自产气供后续批次, k_en: "Start-up gas; off-gas heats later batches once stable"}
  outputs_head: 一批料的产出
  outputs_head_en: WHAT A BATCH GIVES
  facts:
    - {v: "≈4.5", u: t, k: 裂解油, k_en: Pyrolysis oil}
    - {v: "≈3.8", u: t, k: 炭渣 / 回收炭黑, k_en: "Char / recovered carbon black"}
    - {v: 视类型, v_en: "Tyre", u: "", k: 回收钢丝, k_en: "Recovered steel wire, tyre dependent"}
    - {v: "≈0.9", u: t, k: 不凝气，回收供后续批次, k_en: "Non-condensable gas, back to the burner"}
  annual_head: 折成一年
  annual_head_en: OVER A YEAR
  annual:
    - {v: "3,000", u: t/年, u_en: t/yr, k: 入厂原料（10 t/d × 300 天）, k_en: "Feedstock in (10 t/d × 300 days)"}
    - {v: "≈1,350", u: t/年, u_en: t/yr, k: 裂解油, k_en: Pyrolysis oil}
    - {v: "≈1,140", u: t/年, k: 炭渣 / 回收炭黑, k_en: Char / recovered carbon black}
    - {v: "300", u: 天, u_en: days, k: 年运行天数，检修与雨季另计, k_en: "Operating days; maintenance excluded"}
  note: 投入为 10 TPD 间歇式线的运行口径，随原料、含水率、气候与终点判定浮动；钢丝视轮胎类型另计，故四项产出合计不等于 10 t。设备投资、运行成本与回本期随各国电价、油价与人工差异极大，按项目单独测算，不在本册列明。
  note_en: Inputs describe a 10 TPD batch line and vary with feedstock, moisture, climate and end-point; steel wire depends on tyre type, so the four outputs need not sum to 10 t. Equipment cost, running cost and payback differ widely by country, so they are calculated per project and not listed in this brochure.

process:
  kicker: 工艺流程与安全
  kicker_en: PROCESS & SAFETY
  lead: 密闭、无氧、微负压——安全靠结构，不靠人盯。
  lead_en: Sealed, oxygen-free, slightly negative — safety designed in, not watched in.
  image: process.jpg
  steps_head: 连续式七步
  steps_head_en: Continuous line — seven steps
  steps:
    - {num: "01", cn: 氮气置换, cn2: 制氮机把反应釜内氧气置换出去, en: Nitrogen purge, cn2_en: Nitrogen generator purges oxygen out of the reactor}
    - {num: "02", cn: 升温, cn2: 燃油或不凝气加热，2–5 h 升至约 400 °C, en: Heat-up, cn2_en: "Oil or off-gas firing, 2–5 h ramp to about 400 °C"}
    - {num: "03", cn: 无氧进料, cn2: 自动上料器连续进料，密封进料段, en: Sealed feeding, cn2_en: "Automatic feeder, sealed feed section"}
    - {num: "04", cn: 热解分离, cn2: 喷淋气包 → 沉降罐去重油 → 冷凝成燃料油, en: Separation, cn2_en: Spray header → settling tank drops heavy oil → condensers make fuel oil}
    - {num: "05", cn: 不凝气回用, cn2: 两道水封 + 阻火器进热风炉，为后续批次供热, en: Off-gas reuse, cn2_en: Two water seals plus flame arrestor into the hot-air furnace, heating later batches}
    - {num: "06", cn: 烟气净化, cn2: 二级喷淋脱硫除尘 → 引风机 → 烟囱, en: Flue-gas cleaning, cn2_en: Two-stage spray scrubbing → induced-draft fan → stack}
    - {num: "07", cn: 密封出渣, cn2: 全自动出渣，过程无泄漏, en: Sealed discharge, cn2_en: "Fully automatic sealed discharge, no leakage"}
  batch_head: 间歇式单批节拍
  batch_head_en: Batch cycle
  batch:
    - {k: 升温与裂解, v: "9 h", k_en: Heat-up & pyrolysis}
    - {k: 停火与冷却, v: "9 h", k_en: Burner off & cooling}
    - {k: 出渣清理, v: "2 h", k_en: Discharge and cleaning}
    - {k: 完整批次, v: "20 h", k_en: Full batch}
  safety_head: 关键控制点
  safety_head_en: Control points
  safety:
    - {k: 空气进入油气系统, v: 密封 + 微负压 + 气密检查 + 氮气接口, k_en: Air ingress, v_en: Seals + slight negative pressure + leak test + nitrogen connection}
    - {k: 不凝气回火, v: 水封 + 阻火器 + 止回阀 + 顺序联锁, k_en: Off-gas flashback, v_en: Water seal + flame arrestor + check valve + interlock}
    - {k: 系统超压, v: 压力监测 + 声光报警 + 安全泄放 + 紧急停火, k_en: Overpressure, v_en: Pressure monitoring + alarm + relief + emergency shut-off}
    - {k: 冷却水中断, v: 流量与泵状态报警 + 安全停机逻辑, k_en: Cooling water loss, v_en: Flow and pump-status alarm + safe shutdown logic}
    - {k: 残渣自燃, v: 充分冷却 + 开门温度限制 + 密闭输送, k_en: Residue self-ignition, v_en: Full cooling + door temperature limit + sealed conveying}
    - {k: 停电 / 风机故障, v: 燃料切断 + 安全阀位 + 应急电源, k_en: Power / fan failure, v_en: Fuel cut-off + safe valve position + emergency power}
  disclaimer: 排放承诺按项目地标准执行：配脱硫除尘（可选脱硝）可达标，不做「天生达标」的承诺。
  disclaimer_en: Emission guarantees follow local standards — we commit to meeting limits with desulphurization and dedusting (DeNOx optional), never to "inherently compliant".

