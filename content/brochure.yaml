about:
  kicker: 企业简介
  kicker_en: COMPANY PROFILE
  lead: 一家把「图纸、钢板、焊缝、试机、出油」放在同一个厂区里的热解装备制造商。
  lead_en: One factory that owns the whole chain — drawings, steel plates, welds, test runs and the first barrel of oil.
  paras:
    - cn: 我们的河南生产基地 2018 年 12 月投产，占地 50 亩，注册资本 1000 万元。基地专注废轮胎、废塑料、废橡胶、废机油与生物质的热解（裂解）、蒸馏精制、炭化成套装备的设计、制造、安装与售后。
      en: Our Henan production base has been running since December 2018 — a 50-mu site with CNY 10 million in registered capital, specialising in pyrolysis, distillation and carbonization plants for waste tyres, plastics, rubber, waste oil and biomass.
    - cn: 我们不做转手贸易。设计、下料、卷板、焊接、机加工、装配、试机、装车全部在自有厂区完成；五条产品线共用同一套工艺与质量体系，同一批工程师从图纸一直跟到客户出油。
      en: We do not resell. Cutting, rolling, welding, machining, assembly, test running and loading all happen on our own floor — with the same engineers following each project from drawing to first oil.
    - cn: 从环评协助、设备制造、现场安装调试，到人员培训、备件供应与油品外销对接，XG 提供一站式交付。客户只需准备场地、原料与手续，其余交给工厂。
      en: From EIA support and fabrication to site installation, operator training, spare parts and offtake introduction, XG delivers turnkey. The client prepares the site, the feedstock and the permits — the rest is ours.
  facts:
    - {k: 成立时间, k_en: Founded, v: 2018 年 12 月, v_en: Dec 2018}
    - {k: 注册资本, k_en: Registered capital, v: 1000 万元, v_en: CNY 10 million}
    - {k: 厂区占地, k_en: Site area, v: 50 亩, v_en: 50 mu (≈3.3 ha)}
    - {k: 设计团队, k_en: Design team, v: 6 名设计人员, v_en: 6 design engineers}
    - {k: 专利技术, k_en: Patents, v: 12 项, v_en: 12}
    - {k: 出口国家, k_en: Export countries, v: 30 多个, v_en: 30+}
    - {k: 主营产品, k_en: Products, v: 热解 / 蒸馏 / 炭化, v_en: Pyrolysis · Distillation · Carbonization}
    - {k: 交付方式, k_en: Delivery, v: 设计 → 制造 → 安装 → 出油, v_en: Design → Build → Install → First oil}
  image: continuous-line.jpg
  image_cap: 40 TPD 连续式裂解产线车间实拍
  image_cap_en: 40 TPD continuous pyrolysis line under fabrication

