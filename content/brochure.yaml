base:
  kicker: 生产基地
  kicker_en: MANUFACTURING BASE
  lead: 50 亩厂区，从钢板到整机不出厂。
  lead_en: Steel in, complete plants out — without leaving the yard.
  body: 厂房内配行车、卷板、下料、机加工、焊接与总装工位，主炉、冷凝、除尘、气路、电控按整线预装后再拆运。批量订单一排排下料、一排排焊接，交期可控；客户到厂可随时看到自己的设备做到哪一步。
  body_en: Overhead cranes, rolling, cutting, machining, welding and final assembly under one roof. Each plant is pre-assembled as a full line — reactor, condensation, dedusting, gas train and controls — then split for shipment. Clients can walk in any day and see exactly how far their unit has gone.
  photos:
    - {img: hall-lines.jpg, cn: 总装车间：两条产线并行布置，可同时施工多台主机, en: "Assembly hall, two parallel lines — several reactors under construction at once"}
    - {img: ship-reactor.jpg, cn: 主炉装车：齿圈、滚圈、底座整机固定后发运, en: "Reactor on the trailer — gear ring, riding rings and base strapped as one unit"}
    - {img: drums-pair.jpg, cn: 空载试机：温控、压力、密封逐项确认后出厂, en: "No-load test run — temperature, pressure and sealing signed off before dispatch"}
  facts:
    - {k: 厂区占地, v: 50 亩, k_en: Site area, v_en: 50 mu}
    - {k: 车间与总装工位, v: 自有, k_en: Workshop & assembly, v_en: Self-owned}
    - {k: 主体材质, v: Q345R / 12CrMoV, k_en: Shell material, v_en: Q345R / 12CrMoV}
    - {k: 随机文件, v: 图纸 · 试机记录 · 备件清单, k_en: Documents, v_en: Drawings · test records · spares list}
  steps:
    - {num: "01", cn: 下料卷板, cn2: 主炉钢板按图纸放样，数控下料、卷制成型, en: Cutting & rolling, cn2_en: "Shell plate laid out to drawing, CNC cut and rolled"}
    - {num: "02", cn: 筒体焊接, cn2: Q345R / 12CrMoV 锅炉板按压力容器工艺施焊，持证焊工, en: Shell welding, cn2_en: Q345R / 12CrMoV boiler plate welded to pressure-vessel practice by certified welders}
    - {num: "03", cn: 机加工, cn2: 齿圈、滚圈、拖轮、密封面加工与配对, en: Machining, cn2_en: "Girth gear, riding rings, rollers and sealing faces machined and matched"}
    - {num: "04", cn: 整线装配, cn2: 主机与冷凝、除尘、气路、电控预装成线, en: Line assembly, cn2_en: "Reactor pre-assembled with condensation, dedusting, gas train and controls"}
    - {num: "05", cn: 空载试机, cn2: 试运行、气密与温控确认，记录随机, en: Test run, cn2_en: Trial run with air-tightness and temperature checks; records ship with the unit}
    - {num: "06", cn: 涂装标识, cn2: 除锈、底漆面漆、铭牌与位号, en: Painting, cn2_en: "Derusting, primer and topcoat, nameplate and tag numbers"}
    - {num: "07", cn: 装车发货, cn2: 整机或分段装车，随机文件与备件同行, en: Loading, cn2_en: "Shipped whole or in sections, with documents and spares on board"}

quality:
  kicker: 制造与品控
  kicker_en: FABRICATION & QUALITY CONTROL
  lead: 每一台主炉都有编号、有图纸、有检验记录。
  lead_en: Every reactor ships with a serial number, a drawing set and an inspection record.
  body: 制造不是把钢板焊起来就完事。主炉按压力容器工艺施焊，齿圈与拖轮配对研磨，整线预装后通水通电试运行；出厂前逐台留下检验记录，到了客户现场我们对中、找正、联动调试，直到稳定出油。
  body_en: Fabrication is more than welding plates together. Shells are welded to pressure-vessel practice, girth gears and riding rings are matched and ground, and every line is pre-assembled, then run with water, power and feedstock before dispatch.
  image: workshop-lead.jpg
  points:
    - {cn: 材料, cn2: 主炉采用 Q345R / 12CrMoV 锅炉合金钢板，按批次留材质证明与复验记录, en: Material, cn2_en: Shells in Q345R / 12CrMoV boiler plate; mill certificates and re-test records kept per batch}
    - {cn: 焊接, cn2: 持证焊工施焊，ASME IX（GTAW · 6G · P-No.1）资格评定在案，焊缝外观与射线检验, en: Welding, cn2_en: Certified welders to ASME IX (GTAW · 6G · P-No.1); visual and radiographic examination}
    - {cn: 检验, cn2: 气密试验、水压试验、整机空载与带料试运行，逐项签字后才放行, en: Inspection, cn2_en: "Air-tight test, hydrostatic test, no-load and loaded trial runs — signed off item by item"}
    - {cn: 追溯, cn2: 主炉、齿圈、拖轮、密封件逐台建档，出厂附铭牌、随机图册与备件清单, en: Traceability, cn2_en: "Reactor, girth gear, riding rings and seals filed per unit; nameplate, drawings and spares list ship with it"}
    - {cn: 现场, cn2: 安装队随设备进场，负责对中、找正、管线、电气与联动调试, en: On site, cn2_en: "Installation crew on site for alignment, piping, electrical and interlock commissioning"}
  memo: 客户可以到厂监造：站在自己那台主炉旁边，看钢板、看焊缝、看试机。
  memo_en: Clients are welcome to supervise in person — stand next to your own reactor, check the plate, the welds and the test run.
  asme_cap: ASME IX 焊工技能评定证书（GTAW · 6G · P-No.1 · 壁厚 5.54 mm）
  asme_cap_en: ASME IX welder qualification (GTAW, 6G, P-No.1, 5.54 mm)

